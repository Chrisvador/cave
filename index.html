<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ma cave</title>
<meta name="description" content="Cave à vin du foyer : bouteilles, photos, provenance et dégustations.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ma cave">
<meta name="theme-color" content="#f5efe9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1416" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f5efe9; --paper:#fffbf7; --fg:#2a1e21; --muted:#6e5f62; --line:#e4d6d2;
  --acc:#7b1e34; --acc-ink:#fff; --acc-soft:#f2dde1;
  --red:#b8352c; --red-soft:#f7dcd8; --amber:#94650a; --amber-soft:#f6ebc9; --ok:#3f7a4a; --ok-soft:#dcebdc;
  --c-rouge:#7b1e34; --c-blanc:#c9a227; --c-rose:#e07a8f; --c-effervescent:#b9a46a; --c-liquoreux:#c97b12;
  --shadow:0 1px 2px rgba(60,20,30,.06),0 6px 18px rgba(60,20,30,.07);
  --f-head:"Fraunces",Georgia,serif; --f-body:"Atkinson Hyperlegible",-apple-system,system-ui,sans-serif;
  --r:14px; color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1416; --paper:#251d20; --fg:#f0e8ea; --muted:#ad9da1; --line:#3b3034;
  --acc:#e0798f; --acc-ink:#2a0d14; --acc-soft:#43242c;
  --red:#ef7f74; --red-soft:#43231f; --amber:#e3b54a; --amber-soft:#3b3020; --ok:#85c08f; --ok-soft:#203325;
  --c-rouge:#d0566f; --c-blanc:#e3c45a; --c-rose:#f09aac; --c-effervescent:#d8c88e; --c-liquoreux:#e9a04a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:650;letter-spacing:-.01em;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;
  padding:9px 16px;min-height:44px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.icon{width:20px;height:20px;flex:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:30px;line-height:1.1;flex:1;min-width:0}
.top h1 small{display:block;font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;max-width:180px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 4px;border-radius:12px;color:var(--muted);font-size:13px;font-weight:700}
.nav button[aria-current="page"]{color:var(--acc);background:var(--acc-soft)}

/* résumé */
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;min-height:40px;
  font-weight:700;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip b{font-size:15px}
.pastille{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.p-rouge{background:var(--c-rouge)} .p-blanc{background:var(--c-blanc)} .p-rose{background:var(--c-rose)}
.p-effervescent{background:var(--c-effervescent)} .p-liquoreux{background:var(--c-liquoreux)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 16px;min-height:44px}
.tools select{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 14px;min-height:44px}

/* bouteilles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);border:0;padding:0;text-align:left;cursor:pointer;display:grid;grid-template-columns:88px 1fr;overflow:hidden;
  position:relative;min-height:128px}
.card.vide{opacity:.6}
.card .ph{background:var(--acc-soft);display:grid;place-items:center;color:var(--acc);position:relative;overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .ph::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc)}
.card .bd{padding:10px 12px 10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card h3{font-size:18px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .meta{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .de{font-size:13.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:auto}
.card .de i{color:var(--muted);font-style:normal}
.qte{position:absolute;right:10px;top:10px;background:var(--acc);color:var(--acc-ink);font-weight:700;border-radius:999px;min-width:30px;height:30px;padding:0 8px;
  display:grid;place-items:center;font-size:15px}
.card.vide .qte{background:var(--line);color:var(--muted)}
.card .bd h3{padding-right:38px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;background:var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.amber{background:var(--amber-soft);color:var(--amber)} .tag.red{background:var(--red-soft);color:var(--red)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);background:var(--paper);border-radius:var(--r)}
.group{margin:18px 0 8px;font:700 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* historique */
.list{display:grid;gap:8px}
.item{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer}
.item .n{font:700 18px var(--f-head);min-width:36px;text-align:center}
.item .n.out{color:var(--acc)} .item .n.in{color:var(--ok)}
.item .t{font-weight:700}
.item .s{color:var(--muted);font-size:14px}
.item .d{color:var(--muted);font-size:13px;white-space:nowrap}

/* accords */
.acc-form{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:grid;gap:10px}
.acc-form textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:110px;resize:vertical;width:100%}
.acc-form .foot{margin:0}
.acc-ex{display:flex;gap:6px;flex-wrap:wrap}
.acc-ex button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13.5px;cursor:pointer}
.acc-res{display:grid;gap:10px;margin-top:16px}
.sug{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);display:grid;grid-template-columns:72px 1fr;overflow:hidden}
.sug .ph{background:var(--acc-soft);display:grid;place-items:center;color:var(--acc);position:relative;min-height:110px}
.sug .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sug .ph::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc)}
.sug .bd{padding:10px 12px 12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sug h3{font-size:18px;line-height:1.2}
.sug .meta{color:var(--muted);font-size:14px}
.sug p{margin:2px 0 0;font-size:15px}
.sug .acts{margin:6px 0 0;display:flex;gap:8px;flex-wrap:wrap}
.sug .acts .btn{min-height:38px;padding:6px 13px;font-size:14.5px}
.note-acc{background:var(--amber-soft);color:var(--fg);border-radius:12px;padding:11px 14px;font-size:15px}
.note-acc b{color:var(--amber)}
.wait{color:var(--muted);text-align:center;padding:24px}

/* panneau */
.sheet{position:fixed;inset:0;background:rgba(25,10,15,.45);display:flex;justify-content:center;align-items:flex-end;z-index:20}
@media (min-width:760px){.sheet{align-items:center;padding:24px}}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:100%;overflow:auto;border-radius:18px 18px 0 0;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));overscroll-behavior:contain}
@media (min-width:760px){.panel{border-radius:18px;max-height:calc(100vh - 48px)}}
.panel-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{flex:1;font-size:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-body{padding:16px}
.iconbtn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted);min-width:40px;min-height:40px}
.iconbtn:hover{background:var(--paper);color:var(--fg)}
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
@media (max-width:480px){.hero{grid-template-columns:110px 1fr;gap:12px}}
.hero .ph{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--acc-soft);display:grid;place-items:center;color:var(--acc);position:relative}
.hero .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.hero h3{font-size:24px;line-height:1.15}
.hero .dom{color:var(--muted);font-weight:700;margin-top:2px}
.big-q{display:flex;align-items:center;gap:10px;margin-top:12px}
.big-q b{font:650 34px var(--f-head);line-height:1}
.big-q span{color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:14px 0}
.fact{background:var(--paper);border-radius:12px;padding:9px 12px}
.fact span{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fact strong{font-size:16px;word-break:break-word}
.notes{white-space:pre-wrap;background:var(--paper);border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:8px}
.notes b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.notes.de{border-left:4px solid var(--acc)}
.stars{color:var(--c-liquoreux);letter-spacing:2px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline;font-size:15px}
.hist li .d{font-weight:700;min-width:92px}
.hist li .q{font-weight:700;min-width:30px}
.hist li .x{flex:1;color:var(--muted)}
h4{font:650 19px var(--f-head);margin:20px 0 6px}

form.f{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field>span{font-size:13px;font-weight:700;color:var(--muted)}
.field small{color:var(--muted);font-size:13px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:480px){.row3{grid-template-columns:1fr 1fr}}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 13px;min-height:42px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.colors button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.photo-pick{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.photo-pick .ph{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--acc-soft);display:grid;place-items:center;color:var(--acc);position:relative}
.photo-pick .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick .pb{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ana{font-size:14px;color:var(--muted);min-height:1.2em}
.ana.ok{color:var(--ok)}
.ratepick{display:flex;gap:2px}
.ratepick button{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--line);padding:2px 3px}
.ratepick button.on{color:var(--c-liquoreux)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:22px;font-weight:700;cursor:pointer}
.step input{width:80px;text-align:center;font-size:20px;font-weight:700}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.foot .spacer{flex:1}
.err{color:var(--red);font-size:14px;min-height:1em;margin:0}
.box{background:var(--paper);border-radius:12px;padding:14px;margin-bottom:12px}
.box h3{font-size:18px;margin-bottom:6px}
.box p{margin:0 0 10px;color:var(--muted);font-size:15px}
.code{font:700 26px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;background:var(--bg);border-radius:10px;padding:12px;text-align:center;margin:8px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow-x:auto;background:var(--paper)}
.seg button{white-space:nowrap;flex:1 0 auto;border:0;background:transparent;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.auth{max-width:400px;margin:10vh auto 0;padding:24px;background:var(--paper);border-radius:18px;box-shadow:var(--shadow)}
.auth h1{font-size:28px;margin-bottom:6px}
.auth p{color:var(--muted);margin:0 0 16px}
.linkbtn{border:0;background:none;color:var(--acc);font-weight:700;cursor:pointer;padding:6px 0}

.viewer{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vbar{display:flex;justify-content:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.viewer .btn{background:#222;border-color:#444;color:#eee}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(80px + env(safe-area-inset-bottom));z-index:16;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="auth" class="wrap" hidden>
  <div class="auth">
    <h1 id="authTitle">Ma cave</h1>
    <p>Vos bouteilles, partagées avec le foyer. Même compte que l'app Mes chats.</p>
    <form id="authForm" class="f">
      <label class="field" id="authEmailF"><span>E-mail</span><input id="authEmail" type="email" autocomplete="email" required></label>
      <label class="field" id="authPwF"><span>Mot de passe</span><input id="authPw" type="password" autocomplete="current-password"></label>
      <p class="err" id="authErr" role="alert"></p>
      <button class="btn pri" id="authGo" type="submit">Se connecter</button>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <button class="linkbtn" type="button" id="authForgot">Mot de passe oublié ?</button>
        <button class="linkbtn" type="button" id="authAlt">Créer un compte</button>
      </div>
    </form>
  </div>
</section>

<section id="onb" class="wrap" hidden>
  <div class="auth">
    <h1>Votre foyer</h1>
    <p>La cave est partagée entre les membres du foyer.</p>
    <form id="onbForm" class="f">
      <label class="field"><span>Votre prénom</span><input id="onbPrenom" autocomplete="given-name" required></label>
      <div class="seg" role="group" aria-label="Choix">
        <button type="button" data-o="creer" aria-pressed="true">Créer le foyer</button>
        <button type="button" data-o="rejoindre" aria-pressed="false">Rejoindre avec un code</button>
      </div>
      <label class="field" id="onbNomF"><span>Nom du foyer</span><input id="onbNom" placeholder="Ex. Maison Illkirch"></label>
      <label class="field" id="onbCodeF" hidden><span>Code d'invitation</span><input id="onbCode" autocapitalize="characters" autocomplete="off" placeholder="8 caractères"></label>
      <p class="err" id="onbErr" role="alert"></p>
      <button class="btn pri" type="submit" id="onbGo">Continuer</button>
      <button class="linkbtn" type="button" id="onbOut">Se déconnecter</button>
    </form>
  </div>
</section>

<main id="app" class="wrap" hidden>
  <header class="top">
    <h1><small id="sub">Foyer</small><span id="title">Ma cave</span></h1>
    <button class="btn" id="acctBtn" type="button" aria-label="Foyer et compte">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>Réglages</span>
    </button>
  </header>
  <section id="vCave"></section>
  <section id="vHist" hidden></section>
  <section id="vAcc" hidden></section>
  <button class="btn pri fab" id="addBtn" type="button">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg><span>Bouteille</span>
  </button>
</main>

<nav class="nav" id="nav" hidden aria-label="Sections">
  <button data-v="cave" aria-current="page">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M10 2h4v5c0 1 2 2 2 5v9a1 1 0 01-1 1H9a1 1 0 01-1-1v-9c0-3 2-4 2-5z"/><path d="M8 14h8"/></svg>Cave</button>
  <button data-v="acc">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18M5 3v5a2 2 0 004 0V3M17 21V3c-2 0-3.5 3-3.5 7.5H17"/></svg>Accords</button>
  <button data-v="hist">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 3h10l-1 7a4 4 0 01-8 0z"/><path d="M12 14v6M8 21h8"/></svg>Dégustations</button>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="viewer" class="viewer" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
